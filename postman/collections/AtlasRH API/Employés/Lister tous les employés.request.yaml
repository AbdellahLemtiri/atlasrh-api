$kind: http-request
name: "Lister tous les employés"
method: GET
url: '{{base_url}}/api/employees'
order: 2000
queryParams:
  - key: page
    value: '0'
    description: "Numéro de page (Spring Pageable, commence à 0)"
  - key: size
    value: '10'
    description: "Nombre d'employés par page"
  - key: sort
    value: 'lastName,asc'
    description: "Champ et ordre de tri"
  - key: search
    value: ''
    description: "Recherche par nom"
    disabled: true
  - key: departmentId
    value: ''
    description: "Filtrer par département"
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Statut 200 - Liste des employés récupérée", function () {
          pm.response.to.have.status(200);
      });

      pm.test("La réponse est un objet JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("La réponse contient une liste d'employés", function () {
          const json = pm.response.json();
          // Supporte { data: [...] } ou tableau direct
          const list = Array.isArray(json) ? json : json.data;
          pm.expect(list).to.be.an("array");
      });

      pm.test("La réponse contient les métadonnées de pagination", function () {
          const json = pm.response.json();
          // Vérifie la présence de métadonnées de pagination si l'API les retourne
          if (!Array.isArray(json)) {
              pm.expect(json).to.have.any.keys("total", "page", "limit", "meta", "pagination");
          }
      });

      pm.test("Chaque employé contient les champs essentiels", function () {
          const json = pm.response.json();
          const list = Array.isArray(json) ? json : json.data;
          if (list && list.length > 0) {
              list.forEach(function (emp) {
                  pm.expect(emp).to.have.property("id");
                  pm.expect(emp).to.have.property("firstName");
                  pm.expect(emp).to.have.property("lastName");
                  pm.expect(emp).to.have.property("email");
              });
          }
      });
