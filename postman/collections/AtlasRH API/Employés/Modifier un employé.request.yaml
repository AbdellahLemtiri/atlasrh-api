$kind: http-request
name: "Modifier un employé"
method: PUT
url: '{{base_url}}/api/employees/:id'
order: 4000
pathVariables:
  - key: id
    value: '{{employee_id}}'
    description: "Identifiant de l'employé"
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "firstName": "Youssef",
      "lastName": "Alami",
      "email": "youssef.alami@atlasrh.ma",
      "position": "Développeur Senior",
      "hireDate": "2024-01-15",
      "departmentId": 1,
      "managerId": null
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Statut 200 - Employé modifié avec succès", function () {
          pm.response.to.have.status(200);
      });

      pm.test("La réponse est un objet JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("La fiche modifiée contient les champs obligatoires", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("firstName");
          pm.expect(json).to.have.property("lastName");
          pm.expect(json).to.have.property("email");
          pm.expect(json).to.have.property("position");
      });

      pm.test("Le poste a bien été mis à jour", function () {
          const json = pm.response.json();
          pm.expect(json.position).to.eql("Développeur Senior");
      });

      pm.test("L'email n'a pas changé", function () {
          const json = pm.response.json();
          pm.expect(json.email).to.eql("youssef.alami@atlasrh.ma");
      });
