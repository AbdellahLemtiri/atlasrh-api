$kind: http-request
name: "Créer un employé"
method: POST
url: '{{base_url}}/api/employees'
order: 1500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "matricule": "EMP002",
      "firstName": "Youssef",
      "lastName": "Alami",
      "email": "youssef.alami@atlasrh.ma",
      "position": "Développeur Backend",
      "hireDate": "2024-03-01",
      "departmentId": "{{department_id}}",
      "managerId": "{{manager_id}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Statut 201 - Employé créé avec succès", function () {
          pm.response.to.have.status(201);
      });

      pm.test("La réponse est un objet JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("L'employé créé contient les champs obligatoires", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("matricule");
          pm.expect(json).to.have.property("firstName");
          pm.expect(json).to.have.property("lastName");
          pm.expect(json).to.have.property("email");
          pm.expect(json).to.have.property("position");
          pm.expect(json).to.have.property("hireDate");
          pm.expect(json).to.have.property("departmentId");
      });

      pm.test("Le managerId est bien associé", function () {
          const json = pm.response.json();
          const managerId = pm.collectionVariables.get("manager_id");
          if (managerId) {
              pm.expect(String(json.managerId)).to.eql(String(managerId));
          }
      });

      // Sauvegarder l'ID de l'employé
      const json = pm.response.json();
      if (json && json.id) {
          pm.collectionVariables.set("employee_id", json.id);
          console.log("employee_id sauvegardé :", json.id);
      }
